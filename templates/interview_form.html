<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IntelliHire — Generate Interview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
    }
    .navbar-custom {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 16px 32px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .navbar-brand-text {
      font-size: 22px; font-weight: 700;
      background: linear-gradient(90deg, #6c63ff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .btn-nav {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; border-radius: 10px;
      padding: 8px 20px; font-size: 13px;
      text-decoration: none; transition: all 0.3s;
    }
    .btn-nav:hover { background: rgba(255,255,255,0.2); color: #fff; }
    .main-container {
      max-width: 700px; margin: 50px auto; padding: 0 20px;
    }
    .page-title {
      font-size: 32px; font-weight: 700; margin-bottom: 8px;
    }
    .page-title span {
      background: linear-gradient(90deg, #6c63ff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .page-sub { color: rgba(255,255,255,0.5); font-size: 15px; margin-bottom: 36px; }
    .form-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px; padding: 40px;
    }
    .form-label { color: rgba(255,255,255,0.8); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .form-control, .form-select {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: #fff;
      padding: 12px 16px; font-size: 14px;
      transition: all 0.3s;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(255,255,255,0.12);
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
      color: #fff;
    }
    .form-select option { background: #302b63; color: #fff; }
    .form-control::placeholder { color: rgba(255,255,255,0.3); }
    .section-divider {
      color: #a78bfa; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px;
      margin: 24px 0 16px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(108,99,255,0.3);
    }
    .btn-generate {
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      border: none; border-radius: 14px;
      padding: 15px; font-size: 16px; font-weight: 600;
      color: #fff; width: 100%; cursor: pointer;
      transition: all 0.3s; margin-top: 12px;
    }
    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(108,99,255,0.4);
    }
    .loading-overlay {
      display: none; position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(15,12,41,0.9);
      backdrop-filter: blur(10px);
      z-index: 9999;
      flex-direction: column;
      align-items: center; justify-content: center;
    }
    .loading-overlay.active { display: flex; }
    .spinner {
      width: 60px; height: 60px;
      border: 4px solid rgba(108,99,255,0.3);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #a78bfa; font-size: 18px; font-weight: 600; }
    .loading-sub  { color: rgba(255,255,255,0.4); font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <nav class="navbar-custom">
    <span class="navbar-brand-text">🤖 IntelliHire AI</span>
    <a href="{{ url_for('main.intro') }}" class="btn-nav">← Back</a>
  </nav>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">🤖 AI Generating Questions...</div>
    <div class="loading-sub">This may take a few seconds</div>
  </div>

  <div class="main-container">
    <div class="page-title">Generate <span>Interview</span></div>
    <div class="page-sub">Fill in the details and let AI create your personalized interview</div>

    <div class="form-card">
      <form method="POST" action="{{ url_for('interview.generate') }}" onsubmit="showLoading()">

        <div class="section-divider">🏢 Company Details</div>
        <div class="mb-3">
          <label class="form-label">Company Name</label>
          <input type="text" name="company" class="form-control"
            placeholder="e.g. Google, Microsoft, Amazon, TCS" required/>
        </div>

        <div class="section-divider">⚙️ Interview Settings</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Difficulty Level</label>
            <select name="level" class="form-select" required>
              <option value="" disabled selected>Select level</option>
              <option value="Basic">Basic</option>
              <option value="Medium">Medium</option>
              <option value="Advanced">Advanced</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Number of Questions</label>
            <select name="num_questions" class="form-select" required>
              <option value="5">5 Questions</option>
              <option value="10" selected>10 Questions</option>
              <option value="15">15 Questions</option>
              <option value="20">20 Questions</option>
            </select>
          </div>
        </div>

        <div class="section-divider mt-4">🎯 Domain & Subdomain</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Domain</label>
            <select name="domain" class="form-select" required>
              <option value="" disabled selected>Select domain</option>
              <option>Data Analytics</option>
              <option>Data Science</option>
              <option>Software Development</option>
              <option>Full Stack Development</option>
              <option>Machine Learning</option>
              <option>Artificial Intelligence</option>
              <option>Cyber Security</option>
              <option>Cloud Computing</option>
              <option>DevOps</option>
              <option>Business Analyst</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Subdomain</label>
            <select name="subdomain" class="form-select" required>
              <option value="" disabled selected>Select subdomain</option>
              <option>SQL</option>
              <option>Python</option>
              <option>Power BI</option>
              <option>Tableau</option>
              <option>Excel</option>
              <option>Statistics</option>
              <option>Machine Learning</option>
              <option>React</option>
              <option>Flask</option>
              <option>Django</option>
              <option>AWS</option>
              <option>Linux</option>
              <option>Docker</option>
              <option>Kubernetes</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-generate">
          🚀 Generate Interview Questions
        </button>
      </form>
    </div>
  </div>

  <script>
    function showLoading() {
      document.getElementById('loadingOverlay').classList.add('active');
    }
  </script>
</body>
</html>
