<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IntelliHire — Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .bg-circle {
      position: fixed; border-radius: 50%;
      background: rgba(108,99,255,0.15);
      animation: float 8s ease-in-out infinite;
    }
    .bg-circle:nth-child(1) { width:300px; height:300px; top:-80px; right:-80px; animation-delay:0s; }
    .bg-circle:nth-child(2) { width:200px; height:200px; bottom:50px; left:-60px; animation-delay:3s; }
    @keyframes float {
      0%,100% { transform:translateY(0) scale(1); }
      50%      { transform:translateY(-30px) scale(1.05); }
    }
    .card-glass {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 44px 40px;
      width: 100%; max-width: 460px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      animation: slideUp 0.6s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(40px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .brand-title {
      font-size: 26px; font-weight: 700;
      background: linear-gradient(90deg, #6c63ff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .brand-sub { color:rgba(255,255,255,0.5); font-size:13px; margin-bottom:28px; }
    .form-label { color:rgba(255,255,255,0.8); font-size:13px; font-weight:500; margin-bottom:6px; }
    .form-control {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; color:#fff;
      padding: 12px 16px; font-size:14px;
      transition: all 0.3s;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.12);
      border-color: #6c63ff;
      box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
      color:#fff;
    }
    .form-control::placeholder { color:rgba(255,255,255,0.3); }
    .btn-primary-custom {
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      border:none; border-radius:12px;
      padding:13px; font-size:15px; font-weight:600;
      color:#fff; width:100%; cursor:pointer;
      transition: all 0.3s; margin-top:8px;
    }
    .btn-primary-custom:hover {
      transform:translateY(-2px);
      box-shadow:0 10px 30px rgba(108,99,255,0.4);
    }
    .link-text { color:#a78bfa; text-decoration:none; font-weight:500; }
    .link-text:hover { color:#6c63ff; }
    .login-text { color:rgba(255,255,255,0.5); text-align:center; font-size:14px; margin-top:20px; }
    .alert { border-radius:12px; font-size:13px; border:none; }
    .alert-danger  { background:rgba(220,53,69,0.2);  color:#ff6b7a; }
    .alert-success { background:rgba(25,135,84,0.2);  color:#75d9a0; }
  </style>
</head>
<body>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>

  <div class="card-glass">
    <div class="text-center">
      <div class="brand-title">🤖 IntelliHire</div>
      <div class="brand-sub">Create your account</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} mb-3">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Your full name" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm" class="form-control" placeholder="Repeat password" required/>
      </div>
      <button type="submit" class="btn-primary-custom">Create Account →</button>
    </form>

    <div class="login-text">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="link-text">Login here</a>
    </div>
  </div>
</body>
</html>
